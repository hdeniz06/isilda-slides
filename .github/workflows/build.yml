name: build-slides

on:
  push:
    branches: [main]
    paths: ["content/**", "render.py", "brand.json", "scripts/**"]
  workflow_dispatch:
    inputs:
      force:
        description: "Re-render this slideshow id (optional)"
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-slides
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==12.0.0
      - name: Fetch photos + render
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.force }}" ]; then
            python scripts/build.py --force "${{ github.event.inputs.force }}" 2>&1 | tee build_log.txt
          else
            python scripts/build.py 2>&1 | tee build_log.txt
          fi
      - name: Commit rendered slides
        run: |
          git config user.name "isilda-bot"
          git config user.email "isilda-bot@users.noreply.github.com"
          git add site history build_log.txt
          git diff --cached --quiet || git commit -m "render slides [skip ci]"
          git pull --rebase -X theirs origin main && git push
      - name: Publish site to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
      - uses: actions/configure-pages@v5
        continue-on-error: true
        id: pages
      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Cancel stuck Pages deployments
        if: steps.pages.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q --depth=10 origin main || true
          for sha in $(git log -8 --format=%H origin/main); do
            gh api -X POST "repos/${{ github.repository }}/pages/deployments/$sha/cancel" >/dev/null 2>&1 && echo "cancelled $sha" || true
          done
      - if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
